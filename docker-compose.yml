services:
  vintracker:
    build:
      context: .
    image: vintracker:local
    ports:
      - "${VINTRACKER_PORT:-5193}:8000"
    environment:
      IP_ADDR: ${IP_ADDR:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
